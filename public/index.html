<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Vercel PDF Converter with Obscura</title>
    <meta name="title" content="Vercel PDF Converter with Obscura">
    <meta name="description" content="High-performance Vercel serverless function generating PDFs from webpages using Obscura headless browser.">
    <link rel="stylesheet" href="/main.css">
</head>
<body>
    <div id="error" style="display: none;">
        <p id="error-msg"></p>
    </div>
    <div class="wrapper">
        <div class="banner">
            <div class="svg">
                <svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vercel logo" preserveAspectRatio="xMidYMid meet" viewBox="0 0 512 512" style="-ms-transform: rotate(360deg); -webkit-transform: rotate(360deg); transform: rotate(360deg);"><title>Vercel Logo</title><path fill-rule="evenodd" d="M256 48l240 416H16z" fill="white"/><rect x="0" y="0" fill="rgba(0, 0, 0, 0)" /></svg>
            </div>
            <div class="content">
                <h1>Vercel PDF Converter</h1>
                <p>Place <button id="host" type="button" title="Click to copy" onclick="copy()"></button> in front of any URL to generate a PDF version of it.</p>
            </div>
        </div>
        <div class="actions">
            <div id="input-container" class="input-container noselect">
                <p class="input-label noselect">Or enter a URL here</p>
                <div class="center">
                    <input id="url" type="url" class="url-input" autocomplete="off" placeholder="https://..." onkeyup="onInput(this)">
                </div>
            </div>
            <button id="go" type="button" onclick="generate()">Generate!</button>
        </div>
    </div>
    <div class="about">
        <p>Visit <a href="https://github.com/h4ckf0r0day/obscura">Obscura on GitHub</a></p>
    </div>
    <script src="/main.js"></script>
</body>
</html>
